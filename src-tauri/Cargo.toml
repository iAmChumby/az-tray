[package]
name = "az-tray"
version = "0.1.4"
description = "A fast Windows tray controller for Azurite"
authors = ["AzTray contributors"]
edition = "2021"

[lib]
name = "az_tray"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2.8", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2.4", features = [] }
