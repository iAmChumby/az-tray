name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build NSIS installer
        run: npm run tauri build

      - name: Assert built binary contains the MCP server
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "src-tauri/target/release/az-tray.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Built binary not found: $exe" }
          $marker = [Text.Encoding]::ASCII.GetBytes("aztray_mcp_status")
          $bytes = [IO.File]::ReadAllBytes($exe)
          $found = $false
          for ($i = 0; $i -le $bytes.Length - $marker.Length -and -not $found; $i++) {
            if ($bytes[$i] -ne $marker[0]) { continue }
            $match = $true
            for ($j = 1; $j -lt $marker.Length; $j++) {
              if ($bytes[$i + $j] -ne $marker[$j]) { $match = $false; break }
            }
            if ($match) { $found = $true }
          }
          if (-not $found) { throw "az-tray.exe does not contain 'aztray_mcp_status'; refusing to publish a build without MCP." }
          Write-Host "Verified MCP marker in $exe"

      - name: Normalize release assets
        shell: pwsh
        run: |
          $assetDir = Join-Path $env:GITHUB_WORKSPACE "release-assets"
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          $installer = Get-ChildItem -LiteralPath "$env:GITHUB_WORKSPACE\src-tauri\target\release\bundle\nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Tauri did not produce an NSIS setup executable" }
          Copy-Item -LiteralPath $installer.FullName -Destination (Join-Path $assetDir "az-tray-x64-setup.exe") -Force
          $hash = (Get-FileHash -Algorithm SHA256 (Join-Path $assetDir "az-tray-x64-setup.exe")).Hash.ToLowerInvariant()
          "$hash  az-tray-x64-setup.exe" | Set-Content -LiteralPath (Join-Path $assetDir "SHA256SUMS.txt") -Encoding ascii

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/az-tray-x64-setup.exe
            release-assets/SHA256SUMS.txt
          generate_release_notes: true
